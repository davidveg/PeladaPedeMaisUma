appId: br.com.peladapedemaisuma.app
name: Administrador monta times pelas presenças da partida
# Pré-requisito: partida aberta com pelo menos 4 presentes e título único em MATCH_TITLE.
---
- launchApp:
    clearState: true
- tapOn: E-mail
- inputText: ${ADMIN_EMAIL}
- tapOn: Senha
- inputText: ${ADMIN_PASSWORD}
- tapOn: Entrar
- tapOn: Partidas
- tapOn: ${MATCH_TITLE}
- tapOn: Presenças
- scrollUntilVisible:
    element:
      text: Fechar lista e gerar times
- tapOn: Fechar lista e gerar times
- assertVisible: Revisar presentes
- scrollUntilVisible:
    element:
      text: Gerar times
- tapOn: Gerar times
- assertVisible: Ajuste fino dos times
- scrollUntilVisible:
    element:
      text: Continuar
- tapOn: Continuar
- tapOn: Fechar lista e salvar
- tapOn: Salvar
- assertVisible: Equilíbrio e regras
